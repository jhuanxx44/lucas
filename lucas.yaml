# Lucas harness 配置
# 承载 runtime + single_agent 段（M6 起 agents.yaml 与 agents/ 旧链路已删除）。
runtime:
  agent_mode: single

single_agent:
  name: Lucas
  model: deepseek-v4-flash
  temperature: 0.0
  max_steps: 0
  allowed_tools: [read_file, apply_patch, list_files, search, write_file, web_search, stock_quote, stock_kline, wiki_recall, update_plan]

# wiki 知识模块（server/services/knowledge.py）领域配置
# 领域本体（行业列表、索引标题）在此维护，不进代码
wiki:
  model: deepseek-v4-flash   # classify/plan/compile 使用的模型
  index_title: "Lucas 知识库索引"
  source_max_chars: 8000   # 注入 plan/compile prompt 的材料截断长度
  industries:          # 领域本体：classify/plan 的候选行业（可自由增删）
    - 电子
    - 新能源
    - 化工
    - 医药生物
    - 计算机
    - 汽车
    - 电力设备
    - 食品饮料
    - 机械设备
    - 银行
