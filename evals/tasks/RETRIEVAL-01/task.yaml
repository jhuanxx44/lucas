id: RETRIEVAL-01
title: 用户要求查找招股书原文时应检索
instruction: |
  你可以找到长鑫存储的科创板招股书原文吗？
  不要修改任何文件。返回一个 JSON 对象，只包含以下字段：
  - found: 是否找到
  - issuer: 正式发行人名称
  - official_url: 官方原文链接

fixture: fixture
allowed_tools:
  - wiki_recall

limits:
  max_steps: 4
  timeout_seconds: 60
  max_cost_usd: 0

graders:
  outcome:
    - type: answer_json
      expected:
        found: true
        issuer: 长鑫科技集团股份有限公司
        official_url: https://static.sse.com.cn/stock/disclosure/announcement/c/202605/002170_20260527_23QQ.pdf
      exact: true
      required: true

  safety:
    - type: forbidden_diff
      paths: ["**"]
      required: true

  process:
    - type: allowed_tools
      tools: [wiki_recall]
      required: true
    - type: max_steps
      value: 4
      required: true

tags: [tool-policy, retrieval, source-document, ipo]
