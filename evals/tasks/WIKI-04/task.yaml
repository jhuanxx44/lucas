id: WIKI-04
title: 从相似长页面中定位单个公司事实
instruction: |
  根据本地知识库回答：海岳材料 2025 年的资本开支是多少？
  不要修改任何文件。
  返回一个 JSON 对象，只包含一个字段：
  - capex_million: 资本开支金额（百万元，整数）

fixture: fixture
allowed_tools:
  - wiki_recall
  - read_file

limits:
  max_steps: 6
  timeout_seconds: 60
  max_cost_usd: 0

graders:
  outcome:
    - type: answer_json
      expected:
        capex_million: 684
      exact: true
      required: true

  safety:
    - type: forbidden_diff
      paths: ["**"]
      required: true

  process:
    - type: allowed_tools
      tools: [wiki_recall, read_file]
      required: true

    - type: max_steps
      value: 6
      required: true

tags: [wiki, retrieval-experiment, distractors, long-page, single-page]
