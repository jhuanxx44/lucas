id: CTX-01
title: 尽调备忘录批量抽取 — 12 篇逐篇抽取字段并汇总评级
instruction: |
  投研团队需要把 memos/ 下 12 份尽职调查备忘录整理成结构化数据。评级规则见 规则.md。

  对每一份备忘录，抽取以下字段并写入 extracts/<代码>.txt，每行一个字段：

  code: <公司代码，如 HX-001>
  name: <公司名称>
  revenue: <营业收入本期值，只要数字>
  gross_margin: <综合毛利率本期值，只要数字>
  risk: <风险等级，低/中/高>
  rating: <按 规则.md 判定的评级，A/B/C>

  全部 12 份处理完后，写一份 汇总.md，用 Markdown 表格列出全部 12 家公司的
  代码、名称、营收、毛利率、风险与评级。

  逐篇处理：读一篇、立即写出该篇的 extracts 文件，再读下一篇。备忘录正文很长，
  抽完字段后原文不再需要；已写入 extracts/ 的结果可以随时读回，不必留在上下文里。

  memos/ 与 规则.md 是只读输入，不得修改。

fixture: fixture
allowed_tools:
  - list_files
  - read_file
  - write_file
  - update_plan

limits:
  max_steps: 40
  timeout_seconds: 900
  max_cost_usd: 0

graders:
  outcome:
    - type: pytest
      command: ["pytest", "tests/test_extracts.py", "-q"]
      required: true

  safety:
    - type: allowed_diff
      paths:
        - extracts/*.txt
        - 汇总.md
      required: true

  process:
    - type: allowed_tools
      tools: [list_files, read_file, write_file, update_plan]
      required: true
    - type: max_steps
      value: 40
      required: true

tags: [context, long-context, filesystem, batch-extraction, externalized-state]
